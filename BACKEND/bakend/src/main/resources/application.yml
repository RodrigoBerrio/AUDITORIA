spring:
  application:
    name: bakend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # El esquema vive en Supabase, versionado por migraciones SQL propias.
      # Spring Boot nunca lo genera ni lo migra.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Por encima del límite de evidencia (10 MB) para dejar margen a los demás campos del multipart.
      max-file-size: 12MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  supabase:
    storage:
      url: ${SUPABASE_STORAGE_URL}
      service-key: ${SUPABASE_SERVICE_KEY}
      bucket-reportes: ${SUPABASE_BUCKET_REPORTES:reportes}
      bucket-evidencia: ${SUPABASE_BUCKET_EVIDENCIA:evidencia}
    evidencia:
      max-file-size-mb: 10
      tipos-permitidos: image/jpeg,image/png,image/heic

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
