# Perfil usado en pruebas de integración con Testcontainers.
# El datasource real lo inyecta @DynamicPropertySource en cada test;
# estos valores solo evitan que falte una property al levantar el contexto.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test

app:
  jwt:
    secret: test-secret-nunca-usar-en-produccion-0123456789
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.auditoriaindustriales.bakend: DEBUG
